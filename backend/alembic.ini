# alembic.ini : Alembic settings. The database URL is not written here; alembic/env.py reads DATABASE_URL
# from the repository root .env so that the password never ends up in this file.
# Keep this file ASCII only: on Korean Windows, Alembic reads it with the locale encoding (cp949),
# and non-ASCII (UTF-8 Korean) comments make "alembic stamp head" fail with UnicodeDecodeError.
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
