# alembic.ini : DB 스키마 변경 이력 관리 설정.
# 접속 주소는 여기 적지 않고 alembic/env.py가 저장소 루트의 .env(DATABASE_URL)에서 읽는다.
# 비밀번호가 이 파일에 들어가 저장소에 올라가는 일을 막기 위해서다.
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
